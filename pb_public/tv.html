<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周家庭穿搭</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; font-family: 'Microsoft YaHei', sans-serif; }
        #tv-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4vh 4vw; }
        .tv-title { font-size: 4vw; font-weight: bold; margin-bottom: 2vh; text-align: center; }
        .tv-subtitle { font-size: 2vw; color: #b0b0c0; margin-bottom: 4vh; text-align: center; }
        .tv-members { display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 4vw; width: 100%; flex: 1; }
        .tv-card { background: rgba(255,255,255,0.08); border-radius: 2vw; padding: 2vw; width: 28vw; min-height: 60vh; display: flex; flex-direction: column; align-items: center; }
        .tv-card h2 { font-size: 2.5vw; margin-bottom: 1vh; }
        .tv-avatar { width: 10vw; height: 10vw; border-radius: 50%; background: #444; margin-bottom: 2vh; object-fit: cover; }
        .tv-theme { font-size: 1.6vw; color: #ffd700; margin-bottom: 1vh; text-align: center; }
        .tv-items { font-size: 1.4vw; line-height: 2; text-align: center; }
        .tv-score { margin-top: auto; font-size: 1.6vw; color: #90ee90; }
        .tv-loading { font-size: 3vw; }
    </style>
</head>
<body>
    <div id="tv-container">
        <div class="tv-title">本周家庭穿搭</div>
        <div class="tv-subtitle" id="tv-subtitle">加载中...</div>
        <div class="tv-members" id="tv-members"><div class="tv-loading">请稍候</div></div>
    </div>
    <script>
        async function loadOutfit() {
            const res = await fetch('/api/latest_outfit');
            const data = await res.json();
            const subtitle = document.getElementById('tv-subtitle');
            const membersDiv = document.getElementById('tv-members');
            if (!data || !data.plans || data.plans.length === 0) {
                subtitle.innerText = '暂无穿搭方案，请先在管理页生成';
                membersDiv.innerHTML = '';
                return;
            }
            subtitle.innerText = data.date + ' · ' + data.occasion + ' · ' + data.theme;
            membersDiv.innerHTML = data.plans.map(plan => `
                <div class="tv-card">
                    <h2>${plan.member_name}</h2>
                    <div class="tv-avatar"></div>
                    <div class="tv-theme">${plan.theme}</div>
                    <div class="tv-items">${plan.items.map(i => '<div>' + i.item.name + '</div>').join('')}</div>
                    <div class="tv-score">评分：${plan.score ? plan.score.toFixed(2) : '-'}</div>
                </div>
            `).join('');
        }
        loadOutfit();
        setInterval(loadOutfit, 60000);
    </script>
</body>
</html>
